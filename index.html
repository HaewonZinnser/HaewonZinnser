<!DOCTYPE html>
<html lang="ko" class="intro-on">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>정해원 ♥ 박진서 결혼합니다</title>
  <meta name="description" content="2027년 2월 13일 토요일, 더 컨벤션 신사" />
  <meta name="theme-color" content="#faf7f2" />

  <!-- 카카오톡/SNS 링크 미리보기 (크롤러는 JS를 실행하지 않으므로 여기 직접 수정)
       TODO: 배포 후 주소 변경 시 여기도 수정 -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="정해원 ♥ 박진서 결혼합니다" />
  <meta property="og:description" content="2027년 2월 13일 토요일, 더 컨벤션 신사" />
  <meta property="og:image" content="https://haewonzinnser.github.io/images/og.jpg" />
  <meta property="og:url" content="https://haewonzinnser.github.io/" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💐</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Great+Vibes&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=202610261428" />
</head>
<body>
  <!-- 인트로: 손글씨가 써진 뒤 꽃잎으로 흩날리며 메인 화면으로 -->
  <div id="intro" class="intro" aria-hidden="true">
    <div class="intro__hero">
      <img src="images/intro.jpg" alt="" />
      <svg class="intro__line intro__line--1" viewBox="0 0 940 1373"><text x="460" y="260" text-anchor="middle">We're Getting</text></svg>
      <svg class="intro__line intro__line--2" viewBox="0 0 940 1373"><text x="480" y="425" text-anchor="middle">Married!</text></svg>
    </div>
    <canvas class="intro__petals"></canvas>
  </div>
  <div id="petals" aria-hidden="true"></div>
  <button id="lang-toggle" class="lang-toggle" type="button">EN</button>

  <main class="wrap">
    <section id="cover" class="cover"></section>
    <section id="greeting" class="section"></section>
    <section id="gallery" class="section section--tint"></section>
    <section id="calendar" class="section"></section>
    <section id="location" class="section section--tint"></section>
    <section id="account" class="section"></section>
    <footer class="footer">Thank you for celebrating with us</footer>
  </main>

  <!-- 연락하기 모달 -->
  <div id="contact-modal" class="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__panel" data-lenis-prevent role="dialog" aria-modal="true" aria-labelledby="contact-title">
      <button class="modal__close" data-close aria-label="Close">&times;</button>
      <h3 id="contact-title" class="modal__title">연락하기</h3>
      <div id="contact-body"></div>
    </div>
  </div>

  <!-- 갤러리 라이트박스 -->
  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox__close" aria-label="Close">&times;</button>
    <button class="lightbox__nav lightbox__nav--prev" aria-label="Previous">&#8249;</button>
    <img class="lightbox__img" alt="" />
    <button class="lightbox__nav lightbox__nav--next" aria-label="Next">&#8250;</button>
    <div class="lightbox__count"></div>
  </div>

  <button id="bgm-toggle" class="bgm" hidden aria-label="BGM">♪</button>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="js/config.js?v=202610261428"></script>
  <script src="js/main.js?v=202610261428"></script>
</body>
</html>
