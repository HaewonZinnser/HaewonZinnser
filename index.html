  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Great+Vibes&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=202610261625" />
</head>
<body>
  <div id="intro" class="intro" aria-hidden="true">
    <div class="intro__hero">
      <img src="images/intro.jpg" alt="" />
      <canvas class="intro__line intro__line--1" data-text="We're Getting" data-x="460" data-y="260"></canvas>
      <canvas class="intro__line intro__line--2" data-text="Married!" data-x="480" data-y="425"></canvas>
    </div>
    <canvas class="intro__petals"></canvas>
  </div>
  <div id="petals" aria-hidden="true"></div>
  <button id="lang-toggle" class="lang-toggle" type="button">EN</button>

  <main class="wrap">
    <section id="cover" class="cover"></section>
    <section id="greeting" class="section"></section>
    <section id="gallery" class="section section--tint"></section>
    <section id="calendar" class="section"></section>
    <section id="location" class="section section--tint"></section>
    <section id="account" class="section"></section>
    <footer class="footer">Thank you for celebrating with us</footer>
  </main>

  <div id="contact-modal" class="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__panel" data-lenis-prevent role="dialog" aria-modal="true" aria-labelledby="contact-title">
      <button class="modal__close" data-close aria-label="Close">&times;</button>
      <h3 id="contact-title" class="modal__title">연락하기</h3>
      <div id="contact-body"></div>
    </div>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox__close" aria-label="Close">&times;</button>
    <button class="lightbox__nav lightbox__nav--prev" aria-label="Previous">&#8249;</button>
    <img class="lightbox__img" alt="" />
    <button class="lightbox__nav lightbox__nav--next" aria-label="Next">&#8250;</button>
    <div class="lightbox__count"></div>
  </div>

  <button id="bgm-toggle" class="bgm" hidden aria-label="BGM">♪</button>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="js/config.js?v=202610261625"></script>
  <script src="js/main.js?v=202610261625"></script>
